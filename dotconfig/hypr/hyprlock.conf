##

# {{{ Colorscheme
source = ./colorschemes/common-colors-catppuccin-mocha.conf
# }}}

# {{{ General
general {
    hide_cursor      = true
    immediate_render = true
}
# }}}

# {{{ Background
background {
    color = $bg0
    path  = ~/.local/share/wallpaper-lock.png
}
# }}}

# {{{ Password field
input-field {
    fade_on_empty = true
    fade_timeout  = 1000

    position = 0, -200
    halign   = center
    valign   = center

    size         = 250, 50
    dots_size    = 0.1
    dots_spacing = 0.3

    outline_thickness = 2

    inner_color    = $bg0
    outer_color    = $select1
    font_color     = $font
    shadow_color   = $bg0
    check_color    = $warn
    fail_color     = $urgent
    capslock_color = $peach

    shadow_passes = 1
    shadow_size   = 10
    shadow_boost  = 1.5
}
# }}}

# {{{ Time
label {
    text          = cmd[update:1000] date "+%H"
    font_size     = 90
    font_family   = Cantarell

    color         = $font
    shadow_color  = $bg0

    shadow_passes = 1
    shadow_size   = 10
    shadow_boost  = 1.5

    position      = 0, 330
    halign        = center
    valign        = center
}
label {
    text          = cmd[update:1000] date "+%M"
    font_size     = 90
    font_family   = Cantarell

    color         = $font
    shadow_color  = $bg0

    shadow_passes = 1
    shadow_size   = 10
    shadow_boost  = 1.5

    position      = 0, 200
    halign        = center
    valign        = center
}
# }}}

# {{{ Date
label {
    text          = cmd[update:1000] date "+%A, %d %B %Y"
    font_size     = 25
    font_family   = Cantarell

    color         = $font
    shadow_color  = $bg0

    shadow_passes = 1
    shadow_size   = 7
    shadow_boost  = 1.5

    #position      = 0, 250
    position      = 0, 100
    halign        = center
    valign        = center
}
# }}}

# {{{ Keyboard layout
label {
    text          = 󰌌    $LAYOUT[en,ro]
    font_size     = 11
    font_family   = Cantarell

    color         = $font
    shadow_color  = $bg0

    shadow_passes = 1
    shadow_size   = 7
    shadow_boost  = 1.5

    #position      = 0, 250
    position      = 15, 15
    halign        = left
    valign        = bottom
}
# }}}

# {{{ Battery
label {
    text          = cmd[update:1000] echo "    " $(cat /sys/class/power_supply/BAT1/capacity)%
    font_size     = 11
    font_family   = Cantarell

    color         = $font
    shadow_color  = $bg0

    shadow_passes = 1
    shadow_size   = 7
    shadow_boost  = 1.5

    #position      = 0, 250
    position      = -15, 15
    halign        = right
    valign        = bottom
}
# }}}

# {{{ Splash
label {
    text        = cmd[update:0] hyprctl splash
    font_size   = 10
    font_family = Sans

    color       = $font

    position    = 0, 32
    halign      = center
    valign      = bottom
}
# }}}
