##

# {{{ Colorscheme
source = ./colorschemes/common-colors-catppuccin-mocha.conf
# }}}

# {{{ Variables
$col.font      = $fg1
$col.clock     = $fg0
$col.date      = $col.font
$col.user      = $select1
$col.statusbar = $col.clock

$col.clockshadow     = $fg3
$col.dateshadow      = $col.clockshadow
$col.usershadow      = $select1

$size.clock = 105
$size.date  = 20

$shadow_passes.clock = 3
$shadow_size.clock   = 10
$shadow_boost.clock  = 1.5

$shadow_passes.user = 3
$shadow_size.user   = 10
$shadow_boost.user  = .5
# }}}

# {{{ General
general {
  hide_cursor      = true
  immediate_render = true
}
# }}}

# {{{ Animations
bezier = emphasizedAccel, .3,  0,   .8, .15
bezier = emphasizedDecel, .05, .7, .1, 1

animation = fadeIn,  1, 3, emphasizedDecel, slidefadevert 50%
animation = fadeOut, 1, 3, emphasizedAccel, slidefadevert 50%
# }}}

# {{{ Background
background {
  color = rgb($bg0)
  path  = ~/.local/share/wallpaper-lock.png

  blur_passes = 2
  blur_size   = 5
  #noise = 0
  #contrast = 1.3
  #brightness = .7
  #vibrancy = .1
  #vibrancy_darkness = 0
}
# }}}

# {{{ Widgets
# {{{ Clock
label {
  text = cmd[update:1000] date "+%H"

  color       = rgb($col.clock)
  font_size   = $size.clock
  font_family = Sans SemiCondensed DemiBold

  position = 0, 310
  halign   = center
  valign   = center

  shadow_passes = $shadow_passes.clock
  shadow_size   = $shadow_size.clock
  shadow_color  = rgb($col.clockshadow)
  shadow_boost  = $shadow_boost.clock
}
label {
  text = cmd[update:1000] date "+%M"

  color       = rgb($col.clock)
  font_size   = $size.clock
  font_family = Sans SemiCondensed DemiBold

  position = 0, 180
  halign   = center
  valign   = center

  shadow_passes = $shadow_passes.clock
  shadow_size   = $shadow_size.clock
  shadow_color  = rgb($col.clockshadow)
  shadow_boost  = $shadow_boost.clock
}
# }}}
# {{{ Date
label {
  text = cmd[update:1000] date "+%A, %d %B %Y"

  color       = rgb($col.date)
  font_size   = $size.date
  font_family = Sans DemiBold

  position = 0, 70
  halign   = center
  valign   = center

  shadow_passes = $shadow_passes.clock
  shadow_size   = $shadow_size.clock
  shadow_color  = rgb($col.dateshadow)
  shadow_boost  = $shadow_boost.clock
}
# }}}

# {{{ User picture
image {
  path = ~/.face.icon

  size     = 90
  rounding = -1

  border_size = 2
  border_color = rgb($col.user)

  position = 0, -180
  halign   = center
  valign   = center

  shadow_passes = $shadow_passes.user
  shadow_size   = $shadow_size.user
  shadow_color  = rgb($col.usershadow)
  shadow_boost  = $shadow_boost.user
}
# }}}
# {{{ Username
label {
  text = cmd[update:0] grep "${USER}" /etc/passwd | cut -d ":" -f5

  color       = rgb($col.clock)
  font_size   = 13
  font_family = Sans SemiBold

  position = 0, -252
  halign   = center
  valign   = center

  shadow_passes = $shadow_passes.user
  shadow_size   = $shadow_size.user
  shadow_color  = rgb($col.usershadow)
  shadow_boost  = $shadow_boost.user
}
# }}}
# {{{ Input field
input-field {
  size              = 220, 40
  outline_thickness = 2

  dots_size    = .1
  dots_spacing = .3

  outer_color = rgb($col.user)
  inner_color = rgba($bg07f)

  font_color  = rgb($col.font)
  font_family = Sans

  fade_on_empty = false
  fade_timeout  = 1000

  placeholder_text =

  rounding = 15

  check_color = rgb($warn)
  check_text  =

  fail_color = rgb($urgent)
  fail_text  = $FAIL ($ATTEMPTS attempts)

  capslock_color = $peach

  position = 0, -300
  halign   = center
  valign   = center

  shadow_passes = $shadow_passes.user
  shadow_size   = $shadow_size.user
  shadow_color  = rgb($col.usershadow)
  shadow_boost  = $shadow_boost.user
}
# }}}

# {{{ Splash
label {
  text = cmd[update:0] hyprctl splash

  color       = rgb($fg1) #rgba(ffffffbb) #rgba(ffffffcc) #rgba(ffffff55)
  font_size   = 12
  font_family = Sans

  position    = 0, 20
  halign      = center
  valign      = bottom
}
# }}}

# {{{ Status bar
label {
  text = cmd[update:2000] "${XDG_CONFIG_HOME}/hypr/lua/hyprlock/statusBar.lua" right

  color       = rgb($col.statusbar)
  font_size   = 10
  font_family = Sans

  position = -10, -5
  halign   = right
  valign   = top
}
label {
  text = cmd[update:1800000] "${XDG_CONFIG_HOME}/hypr/lua/hyprlock/statusBar.lua" left

  color       = rgb($col.statusbar)
  font_size   = 10
  font_family = Sans

  position = 10, -5
  halign   = left
  valign   = top
}
# }}}
# }}}
